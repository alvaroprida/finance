name: Daily market update

on:
  schedule:
    # Every day at 22:30 UTC, after the US close.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch market data
        working-directory: pipeline
        run: python fetch_data.py

      - name: Evaluate alert thresholds
        working-directory: pipeline
        run: python alerts.py

      - name: Build daily PDF
        working-directory: pipeline
        run: python report.py

      - name: Commit refreshed data and report
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add docs/data docs/reports
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily market update $(date -u +%F)"
            git push
          fi
